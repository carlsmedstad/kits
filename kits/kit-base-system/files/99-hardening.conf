# Kernel hardening on top of the Arch kernel's defaults, which already
# restrict dmesg, ptrace, unprivileged BPF and the fs.protected_* set. User
# namespaces stay enabled for rootless containers.

# Hide kernel pointers from unprivileged users.
kernel.kptr_restrict = 1

# Do not let root replace the running kernel with kexec.
kernel.kexec_load_disabled = 1

# Full address space randomization entropy.
vm.mmap_rnd_bits = 32
vm.mmap_rnd_compat_bits = 16

# A laptop is not a router: never send ICMP redirects, and ignore received
# ones, which let another host on the network reroute traffic through itself.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Protect against TIME-WAIT assassination (RFC 1337).
net.ipv4.tcp_rfc1337 = 1
